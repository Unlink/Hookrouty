name: Publish Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          if [[ "$EVENT_NAME" == release && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tag must be vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
            exit 1
          fi
          printf 'name=%s\n' "$image" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            printf '%s:sha-%s\n' "$image" "$COMMIT_SHA"
            if [[ "$EVENT_NAME" == release ]]; then
              printf '%s:%s\n' "$image" "${RELEASE_TAG#v}"
              if [[ "$PRERELEASE" == false && "$RELEASE_TAG" != *-* ]]; then
                printf '%s:latest\n' "$image"
              fi
            else
              printf '%s:latest\n' "$image"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Hookrouty
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Report published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          {
            printf '## Published image\n\n'
            printf '%s@%s\n\n' "$IMAGE" "$DIGEST"
            printf 'Tags:\n%s\n' "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
