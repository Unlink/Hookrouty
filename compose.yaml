services:
  hookrouty:
    image: ${HOOKROUTY_IMAGE:?Set HOOKROUTY_IMAGE to a versioned image}
    restart: unless-stopped
    ports:
      - "${HOOKROUTY_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAX_INFLIGHT_REQUESTS: ${MAX_INFLIGHT_REQUESTS:-20}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      MAX_RENDERED_BODY_BYTES: ${MAX_RENDERED_BODY_BYTES:-1048576}
      MAX_UPSTREAM_RESPONSE_BYTES: ${MAX_UPSTREAM_RESPONSE_BYTES:-8388608}
      HISTORY_CAPTURE_BYTES: ${HISTORY_CAPTURE_BYTES:-16384}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-7}
      HISTORY_MAX_RECORDS: ${HISTORY_MAX_RECORDS:-10000}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-30}
    volumes:
      - hookrouty-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: ${STOP_GRACE_PERIOD:-35s}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
volumes:
  hookrouty-data:
